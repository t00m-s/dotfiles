general {
    # The dedicated command to trigger Noctalia's lockscreen
    lock_cmd = noctalia msg session lock
    # Ensures the screen is locked safely before the system drops into RAM suspend
    before_sleep_cmd = noctalia msg session lock
    ignore_dbus_inhibit = false
}

# 1. DIM SCREEN (Saves power when idle)
listener {
    timeout = 150                                 # 2.5 minutes
    on-timeout = brightnessctl -s set 10          # Dim backlight to 10%
    on-resume = brightnessctl -r                  # Restore backlight
}

# 2. LOCK SCREEN
listener {
    timeout = 300                                 # 5 minutes
    on-timeout = noctalia msg session lock         # Lock via Noctalia
}

# 3. TURN OFF MONITOR
listener {
    timeout = 330                                 # 5.5 minutes
    on-timeout = noctalia msg dpms-off            # Noctalia native display off
    on-resume = noctalia msg dpms-on             # Noctalia native display on
}

# 4. SUSPEND SYSTEM
listener {
    timeout = 600                                 # 10 minutes
    # Using 'lock-and-suspend' ensures state safety right at the 10-minute mark
    on-timeout = noctalia msg session lock-and-suspend 
}
